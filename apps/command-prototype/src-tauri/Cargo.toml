[package]
name = "git-k-prototype"
version = "0.1.0"
description = "Throwaway Git-K execution-history prototype"
edition = "2021"

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:serde_json"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
